[project]
name = "pb-stats"
version = "0.1.0"
description = "Local, evidence-linked analysis of professional doubles pickleball footage."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anyio<4.15",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8,<10",
    "ruff>=0.15,<1",
    "ty>=0.0.73,<0.1",
]

[tool.uv]
package = false
required-version = ">=0.12.10,<0.13"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "PYI", "PGH", "RUF"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
ignore-fully-untyped = false
mypy-init-return = false
suppress-dummy-args = false
suppress-none-returning = false

[tool.ty.environment]
python-version = "3.12"
extra-paths = ["src"]

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "error"
unsound-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unresolved-import = "error"
unused-ignore-comment = "error"

[tool.ty.analysis]
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ty.src]
include = ["src", "scripts", "tests"]
